<mat-toolbar color="primary" class="app-bar">
  <img class="logo" src="card-art/misc/logo.png" alt="" />
  <h1><a class="brand" routerLink="/play">{{ title() }}</a></h1>
  <nav class="nav">
    <a mat-button class="nav-play" routerLink="/play" [class.active]="playActive()" [attr.aria-current]="playActive() ? 'page' : null" aria-label="Play Game">
      <mat-icon>play_arrow</mat-icon><span class="label">Play Game</span>
    </a>
    @for (page of wikiPages; track page.path) {
      <a mat-button class="nav-wiki" [routerLink]="page.path" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.aria-label]="page.label">
        <mat-icon [fontSet]="page.symbol ? 'material-symbols-outlined' : ''">{{ page.icon }}</mat-icon><span class="label">{{ page.label }}</span>
      </a>
    }
  </nav>
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    class="music-toggle"
    (click)="music.toggle()"
    [attr.aria-label]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
    [attr.aria-pressed]="music.enabled()"
    [attr.title]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
  >
    <mat-icon>{{ music.enabled() ? 'music_note' : 'music_off' }}</mat-icon>
  </button>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
