<mat-toolbar color="primary" class="app-bar">
  <img class="logo" src="card-art/misc/logo.png" alt="" />
  <h1><a class="brand" routerLink="/play">{{ title() }}</a></h1>
  <nav class="nav">
    <a mat-button class="nav-play" routerLink="/play" [class.active]="playActive()" [attr.aria-current]="playActive() ? 'page' : null" aria-label="Play">
      <mat-icon>play_arrow</mat-icon><span class="label">Play</span>
    </a>
    <button mat-button type="button" class="nav-cards" [matMenuTriggerFor]="cardsMenu" [class.active]="cardsActive()" aria-label="Cards">
      <!-- "swords" only exists in Material Symbols, not the legacy Material Icons font. -->
      <mat-icon fontSet="material-symbols-outlined">swords</mat-icon><span class="label">Cards</span>
    </button>
    <mat-menu #cardsMenu="matMenu">
      @for (page of cardPages; track page.path) {
        <a mat-menu-item [routerLink]="page.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ page.label }}</a>
      }
    </mat-menu>
    <button mat-button type="button" class="nav-rules" [matMenuTriggerFor]="rulesMenu" [class.active]="rulesActive()" aria-label="Rules">
      <mat-icon>menu_book</mat-icon><span class="label">Rules</span>
    </button>
    <mat-menu #rulesMenu="matMenu">
      @for (page of rulesPages; track page.path) {
        <a mat-menu-item [routerLink]="page.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ page.label }}</a>
      }
    </mat-menu>
  </nav>
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    class="music-toggle"
    (click)="music.toggle()"
    [attr.aria-label]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
    [attr.aria-pressed]="music.enabled()"
    [attr.title]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
  >
    <mat-icon>{{ music.enabled() ? 'music_note' : 'music_off' }}</mat-icon>
  </button>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
