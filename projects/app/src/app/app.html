<mat-toolbar color="primary" class="app-bar">
  <mat-icon aria-hidden="true">castle</mat-icon>
  <h1>{{ title() }}</h1>
  <nav class="nav">
    <a mat-button class="nav-play" routerLink="/play" [class.active]="playActive()" [attr.aria-current]="playActive() ? 'page' : null" aria-label="Play Game">
      <mat-icon>play_arrow</mat-icon><span class="label">Play Game</span>
    </a>
    <button mat-button type="button" class="nav-wiki" [matMenuTriggerFor]="wikiMenu" [class.active]="wikiActive()" aria-label="Wiki">
      <mat-icon>menu_book</mat-icon><span class="label">Wiki</span><mat-icon iconPositionEnd class="drop">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #wikiMenu="matMenu">
      @for (page of wikiPages; track page.path) {
        <a mat-menu-item [routerLink]="page.path" routerLinkActive="current" ariaCurrentWhenActive="page">{{ page.label }}</a>
      }
    </mat-menu>
  </nav>
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    class="music-toggle"
    (click)="music.toggle()"
    [attr.aria-label]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
    [attr.aria-pressed]="music.enabled()"
    [attr.title]="music.enabled() ? 'Turn Music Off' : 'Turn Music On'"
  >
    <mat-icon>{{ music.enabled() ? 'music_note' : 'music_off' }}</mat-icon>
  </button>
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
